<style>
:root{--tinta:#23291f;--marca:#2f4a34;--claro:#d5dfcc;--acento:#c0663a;--sol:#f6c68f;--papel:#fbf8f1}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--papel);font-family:Inter,sans-serif;color:var(--tinta);overflow:hidden;position:relative}
.marca{display:flex;align-items:center;gap:16px;font-family:Fraunces,serif;font-weight:600;color:var(--marca)}
.temp{font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--acento)}
.mano{font-family:"Amatic SC",cursive;line-height:.9;color:var(--acento)}
h1{font-family:Fraunces,serif;font-weight:700;line-height:1.02;color:var(--marca);letter-spacing:-.01em}
.foto{position:absolute;overflow:hidden}.foto img{width:100%;height:100%;object-fit:cover}
.sticker{position:absolute;border-radius:50%;background:var(--sol);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);color:var(--marca);box-shadow:0 10px 30px rgba(35,41,31,.18);z-index:2}
.sticker b{font-family:"Amatic SC";line-height:.85}.sticker span{font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.f{border-radius:28px;background:var(--marca);color:#fff}.f.b{background:var(--acento)}
.f .mes{font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.f .dias{font-family:Fraunces,serif;font-weight:700;line-height:1}.f .dias small{font-weight:600;opacity:.9;margin:0 6px}
.pilares{position:absolute;display:flex;justify-content:space-between;align-items:center;font-family:"Amatic SC";color:var(--marca)}
.pilares i{width:10px;height:10px;border-radius:50%;background:var(--acento)}
.pie{position:absolute;left:0;right:0;bottom:0;background:var(--marca);color:#fff}
.ins{font-family:Fraunces,serif;font-weight:600}.ins span{display:block;font-family:Inter;font-weight:500;color:var(--claro);margin-top:4px}
.contacto{font-weight:600;line-height:1.5}.contacto div{display:flex;align-items:center;gap:12px}.contacto svg{fill:var(--sol)}
.cerros{position:absolute;left:0;display:block}
